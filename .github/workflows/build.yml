name: build

# 每次推送与 PR 都跑一遍：Windows 环境编译 + 自检 + 打包绿色版
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & Self-test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # build.bat 使用 Windows 自带的 .NET Framework 编译器，
      # 不需要装 Visual Studio 或 .NET SDK。
      - name: Build (AnyCPU)
        shell: cmd
        run: build.bat anycpu silent

      - name: Build (x86)
        shell: cmd
        run: build.bat x86 silent

      - name: Environment self-test
        shell: cmd
        timeout-minutes: 3
        run: |
          RemoteHub.exe --selftest
          if errorlevel 1 exit /b 1
          type selftest.log

      # 标题栏按钮是手工定位的，窗口宽度一变就必须重新贴边。
      # 这个自检会把窗口实际拉过几个宽度，逐个断言关闭键仍紧贴右缘。
      - name: Caption button layout test
        shell: cmd
        timeout-minutes: 3
        run: |
          RemoteHub.exe --layouttest
          if errorlevel 1 exit /b 1
          type layouttest.log

      # 连接链路自检会真正驱动 RDP 控件，需要系统装了「远程桌面客户端」。
      # runner 上不一定有，所以先尽力启用；启用不了就跳过这一项，不阻塞构建。
      - name: Enable Remote Desktop client
        shell: pwsh
        continue-on-error: true
        run: |
          try {
            Enable-WindowsOptionalFeature -Online -FeatureName RemoteDesktopClient -All -NoRestart | Out-Null
            Write-Host "RemoteDesktopClient: enabled"
          } catch {
            Write-Host "RemoteDesktopClient: not available on this runner ($_)"
          }

      - name: Connection smoke test
        shell: cmd
        timeout-minutes: 3
        continue-on-error: true
        run: |
          RemoteHub.exe --smoke
          if exist smoke.log type smoke.log

      # 绿色版：拷贝 exe + 使用说明 + portable.flag
      - name: Pack portable edition
        shell: cmd
        run: |
          mkdir dist\Portable\RemoteHub\Data
          copy /y RemoteHub.exe dist\Portable\RemoteHub\
          copy /y UserGuide.txt dist\Portable\RemoteHub\
          echo RemoteHub Portable Edition> dist\Portable\RemoteHub\portable.flag

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: RemoteHub-portable
          path: dist/Portable/RemoteHub/*

      - name: Upload self-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-log
          path: selftest.log

      - name: Upload layout test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layouttest-log
          path: layouttest.log

  release:
    name: Build installer
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: cmd
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: cmd
        run: build-release.bat silent
        continue-on-error: true

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: RemoteHub-installer
          path: dist/RemoteHub-*-Setup.exe
